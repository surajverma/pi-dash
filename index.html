<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pi-hole Dashboard</title>
    <link rel="icon" href="{{ICON_URL}}" />
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" id="theme-color-meta" content="#1f2937" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/dashboard.css" />
    <script>
      if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
        document.getElementById('theme-color-meta').setAttribute('content', '#111827');
      } else {
        document.documentElement.classList.remove('dark');
        document.getElementById('theme-color-meta').setAttribute('content', '#f9fafb');
      }
    </script>
  </head>
  <body class="bg-gray-100 dark:bg-gray-800 text-gray-800 dark:text-gray-200 transition-colors duration-300">
    <div id="main-wrapper" class="w-full mx-auto relative z-10">
      <header class="text-center mb-6">
        <h1 class="text-3xl font-bold text-gray-900 dark:text-white">Pi-Dash</h1>
        <p id="last-updated" class="text-xs text-gray-500 dark:text-gray-400" role="status">Last updated: Never</p>
      </header>
      <section id="network-summary" hidden class="bg-white dark:bg-gray-900 p-4 rounded-lg shadow-lg w-full mb-6" aria-label="Network summary">
        <div class="network-heading">
          <h2 class="text-sm font-semibold text-gray-700 dark:text-cyan-400">Network Summary</h2>
          <span class="network-health text-xs text-gray-500 dark:text-gray-400"></span>
        </div>
        <p class="network-partial" hidden>Partial totals. One or more Pi-holes are not reporting.</p>
        <div class="network-metrics text-sm">
          <div><div class="text-xs text-gray-500 dark:text-gray-400">Queries</div><div class="network-total font-medium text-blue-500">--</div></div>
          <div><div class="text-xs text-gray-500 dark:text-gray-400">Blocked</div><div class="network-blocked font-medium text-red-500">--</div></div>
          <div><div class="text-xs text-gray-500 dark:text-gray-400">Blocked %</div><div class="network-percent font-medium text-yellow-600 dark:text-yellow-500">--%</div></div>
          <div><div class="text-xs text-gray-500 dark:text-gray-400">Cached / Forwarded</div><div class="network-cache font-medium text-indigo-500">-- / --</div></div>
        </div>
      </section>
      <main class="w-full grid grid-cols-1 sm:grid-cols-2 gap-4"></main>
      <section id="query-panel" class="query-panel" hidden aria-label="Recent DNS queries">
        <div class="query-panel-header">
          <span class="query-panel-title">Recent queries</span>
          <div class="query-actions">
            <button id="query-pause" type="button" aria-pressed="false">Pause</button>
            <button id="query-toggle" type="button" aria-expanded="false" aria-controls="background-queries">Show queries</button>
          </div>
        </div>
        <ul id="background-queries" aria-label="Recent DNS query activity"></ul>
      </section>
    </div>
    <script src="js/dashboard-core.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
